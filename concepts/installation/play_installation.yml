---
- name: Installation --> Pis
  hosts: pis
  become: false

  vars:
    python_path: "/home/{{ ansible_user }}/Desktop/MESH/concepts/installation/cv_test_vector.py"
    sc_path: "/home/{{ ansible_user }}/Desktop/MESH/concepts/installation/playground3.scd"
    jack_hw_device: "hw:Gen"


  tasks:

    - name: Kill jackd
      ansible.builtin.command: killall jackd
      ignore_errors: yes

    - name: Kill processing
      ansible.builtin.command: pkill -f processing
      ignore_errors: yes

    - name: Kill sclang
      ansible.builtin.command: killall sclang
      ignore_errors: yes

    - name: Kill spython
      ansible.builtin.command: killall python3
      ignore_errors: yes

    - name: Kill vlc
      ansible.builtin.command: killall vlc
      ignore_errors: yes
    
    - name: Kill scsynth
      ansible.builtin.command: killall scsynth
      ignore_errors: yes

    - name: Kill all existing jackd processes
      ansible.builtin.command: killall jackd
      ignore_errors: yes

    - name: Start jackd in background with correct env vars
      ansible.builtin.shell: |
        export JACK_NO_AUDIO_RESERVATION=1
        jackd -d alsa -d {{ jack_hw_device }} -r 48000 -p 128 > /home/{{ ansible_user }}/Desktop/jack_log.txt 2>&1
      async: 1
      poll: 0

    - name: Run OpenCV motion script on Pi display
      become: true
      become_user: student
      environment:
        DISPLAY: ":0"
      ansible.builtin.command: python3 {{ python_path }} 
      async: 3600
      poll: 0

    - name: Run SuperCollider soundscape on Pis
      ansible.builtin.shell: |
        export QT_QPA_PLATFORM=offscreen
        sclang {{ sc_path }}
      async: 3600
      poll: 0
      args:
        executable: /bin/bash


- name: Installation --> Bees
  hosts: bees
  become: false  

  vars: 
    processing_dir: "{{ ansible_env.HOME }}/Desktop/MESH/concepts/installation/osc_installation"

  tasks: 

    - name: Run Processing sketch on the remote display
      become: false
      environment:
        DISPLAY: ":1"   
        XAUTHORITY: "/home/{{ ansible_user }}/.Xauthority"
      ansible.builtin.command: nohup processing-java --sketch={{ processing_dir }} --run
      async: 9000
      poll: 0


