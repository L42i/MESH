---
- name: Motion soundscape --> Pis
  hosts: pis
  become: false

  vars:
    python_path: "/home/{{ ansible_user }}/Desktop/MESH/concepts/opencv/cv_vector.py"
    sc_path: "/home/{{ ansible_user }}/Desktop/MESH/concepts/installation/soundscape.scd"
    jack_hw_device: "hw:Gen"

  tasks:
    - name: Kill all existing jackd processes
      ansible.builtin.command: killall jackd
      ignore_errors: yes

    - name: Start jackd in background with correct env vars
      ansible.builtin.shell: |
        export JACK_NO_AUDIO_RESERVATION=1
        jackd -d alsa -d {{ jack_hw_device }} -r 48000 -p 128 > /home/{{ ansible_user }}/Desktop/jack_log.txt 2>&1
      async: 1
      poll: 0

    - name: Run SuperCollider soundscape on Pis
      ansible.builtin.shell: |
        export QT_QPA_PLATFORM=offscreen
        sclang {{ sc_path }} > /home/{{ ansible_user }}/Desktop/sclang.txt 2>&1
      async: 3600
      poll: 0
      args:
        executable: /bin/bash

    - name: Run OpenCV motion script on Pi display
      become: true
      become_user: student
      environment:
        DISPLAY: ":0"
      ansible.builtin.command: python3 {{ python_path }} 
      async: 3600
      poll: 0

    


