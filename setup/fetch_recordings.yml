---
- name: Fetch remote directory to local
  hosts: all

  tasks:
    - name: Ensure local per-host directory exists
      ansible.builtin.file:
        path: "../Recordings/{{ inventory_hostname }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: Synchronize remote directory to per-host local folder
      ansible.posix.synchronize:
        src: /home/student/Desktop/Recordings/
        dest: "../Recordings/{{ inventory_hostname }}/"
        mode: pull
        recursive: yes
