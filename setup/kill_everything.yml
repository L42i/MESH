---
- name: Kill all
  hosts: all
  become: false

  tasks:

    - name: Kill jackd
      ansible.builtin.command: killall jackd
      ignore_errors: yes

    - name: Kill processing
      ansible.builtin.command: pkill -f processing
      ignore_errors: yes

    - name: Kill sclang
      ansible.builtin.command: killall sclang
      ignore_errors: yes

    - name: kill chuck
      shell: pkill chuck || true
      ignore_errors: yes

    - name: Kill spython
      ansible.builtin.command: killall python3
      ignore_errors: yes

    - name: Kill vlc
      ansible.builtin.command: killall vlc
      ignore_errors: yes
    
    - name: Kill scsynth
      ansible.builtin.command: killall scsynth
      ignore_errors: yes

    - name: Kill all aplay things
      command: killall -9 aplay
      ignore_errors: true

